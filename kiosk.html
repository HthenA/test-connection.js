<script>
    let kioskMode = 'firing'; 
    let isClassMode = false;
    let selectedUserRole = 'member';
    
    // ─── CONFIGURATION SECTION ──────────────────────────────────────
    // 1. Paste your secure, read-only Google Sheets "Roster" CSV link here:
    const googleSheetCsvUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRgAAEFjn7u53xehyieeKCxXD-nLxtUBHcO4swhGJL1_04MlJEI3GOMPjoCjlGuIX02IvVdsGmKLmt7/pubhtml?gid=973520264&single=true&output=csv";

    // 2. Paste your Make.com "Log Firing" Webhook URL here:
    const makeWebhookUrl = "PASTE_YOUR_MAKE_WEBHOOK_URL_HERE";
    // ────────────────────────────────────────────────────────────────

    let serverStudents = [];

    window.onload = function() {
        fetchRosterFromGoogleSheets();
    };

    async function fetchRosterFromGoogleSheets() {
        try {
            // Natively fetches your 5-column Roster from Google Sheets as a CSV completely free!
            const response = await fetch(googleSheetCsvUrl);
            const csvText = await response.text();
            
            const lines = csvText.split('\n');
            serverStudents = [];
            
            for (let i = 1; i < lines.length; i++) {
                const row = lines[i].split(',');
                if (row.length >= 5) {
                    const lastName = row[0].replace(/"/g, '').trim();
                    const firstName = row[1].replace(/"/g, '').trim();
                    const fullName = `${firstName} ${lastName}`.trim();
                    const role = row[3].replace(/"/g, '').trim().toLowerCase();
                    const status = row[4].replace(/"/g, '').trim().toLowerCase();
                    
                    if (fullName && status === 'active') {
                        let mappedRole = role;
                        
                        // Smart translation for your active studio roster roles:
                        if (role === 'student') mappedRole = 'class';
                        if (role === 'sa' || role === 'studio assistant') mappedRole = 'assistant'; // 15% discount
                        if (role === 'osp' || role === 'open studio pass') mappedRole = 'member';   // 10% clay discount
                        
                        serverStudents.push({ name: fullName, role: mappedRole });
                    }
                }
            }
            console.log("Successfully loaded roster from Google Sheets:", serverStudents);
        } catch (error) {
            console.error("Failed to connect to Google Sheets. Using offline defaults.", error);
            serverStudents = [
                { name: "Alice Smith (Offline)", role: "member" },
                { name: "Bob Jones (Offline)", role: "assistant" },
                { name: "Charlie Brown (Offline)", role: "class" }
            ];
        }
    }

    function selectKioskMode(mode) {
        kioskMode = mode;
        nextStep(1);
    }

    function selectClassOption(isClass) {
        isClassMode = isClass;
        const classFields = document.getElementById('class-fields');
        const roleTitle = document.getElementById('role-title');
        
        if (isClass) {
            classFields.style.display = 'block';
            roleTitle.innerText = "Class Student Details";
        } else {
            classFields.style.display = 'none';
            roleTitle.innerText = "Member Details";
        }
        
        loadStudentDropdown();
        nextStep(2);
    }

    function loadStudents() {
        loadStudentDropdown();
    }

    function loadStudentDropdown() {
        const select = document.getElementById('student-select');
        select.innerHTML = '<option value="">-- Choose Name --</option>';

        if (Array.isArray(serverStudents)) {
            serverStudents.forEach(student => {
                if (isClassMode && student.role === 'class') {
                    const opt = document.createElement('option');
                    opt.value = student.name;
                    opt.innerText = student.name;
                    opt.setAttribute('data-role', 'class');
                    select.appendChild(opt);
                } else if (!isClassMode && student.role !== 'class') {
                    const opt = document.createElement('option');
                    opt.value = student.name;
                    opt.innerText = student.name;
                    opt.setAttribute('data-role', student.role);
                    select.appendChild(opt);
                }
            });
        }
    }

    function onStudentSelect() {
        const select = document.getElementById('student-select');
        const selectedOption = select.options[select.selectedIndex];
        if (selectedOption) {
            selectedUserRole = selectedOption.getAttribute('data-role') || 'member';
        }
        calculatePrices();
    }

    function calculatePrices() {
        if (kioskMode === 'firing') {
            calculateFiringPrice();
        } else {
            calculateClayPrice();
        }
    }

    function calculateFiringPrice() {
        const h = parseFloat(document.getElementById('height').value) || 0;
        const w = parseFloat(document.getElementById('width').value) || 0;
        const d = parseFloat(document.getElementById('depth').value) || 0;
        
        const volume = h * w * d;
        document.getElementById('vol-display').innerText = volume.toFixed(2);

        let cost = 0;
        let note = "";

        const baseRate = 0.06;
        let rawCost = volume * baseRate;
        
        if (rawCost > 0 && rawCost < 1.00) {
            cost = 1.00;
            note = "$1.00 minimum charge applied for small volumes.";
        } else {
            cost = rawCost;
        }

        if (selectedUserRole === 'assistant') {
            cost = cost * 0.85; 
            note = "Studio Assistant: 15% discount applied to firing.";
        } else if (selectedUserRole === 'class') {
            note = "Class Student: Full firing rate applies ($0.06/CI).";
        } else {
            note = "Member: Full firing rate applies ($0.06/CI).";
        }

        document.getElementById('cost-display').innerText = cost.toFixed(2);
        document.getElementById('logic-note-firing').innerText = note;
        return { volume, cost };
    }

    function calculateClayPrice() {
        const select = document.getElementById('clay-bag-select');
        const basePrice = parseFloat(select.options[select.selectedIndex].getAttribute('data-price')) || 20.00;
        
        let cost = basePrice;
        let note = "";

        if (selectedUserRole === 'assistant') {
            cost = basePrice * 0.85; 
            note = "Studio Assistant: 15% discount applied to clay.";
        } else if (selectedUserRole === 'member') {
            cost = basePrice * 0.90; 
            note = "Open Studio Pass (OSP): 10% discount applied to clay.";
        } else {
            note = "Class Student: Full clay price applies.";
        }

        document.getElementById('clay-cost-display').innerText = cost.toFixed(2);
        document.getElementById('logic-note-clay').innerText = note;
        return { cost };
    }

    function goToStep3() {
        const studentName = document.getElementById('student-select').value;
        if (!studentName) {
            alert("Please select your name first.");
            return;
        }

        calculatePrices();

        if (kioskMode === 'firing') {
            nextStep('3-firing');
        } else {
            nextStep('3-clay');
        }
    }

    function showSlip(type) {
        const studentName = document.getElementById('student-select').value;
        const now = new Date();
        const days = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
        const formattedDateHeader = `${days[now.getDay()]} - ${now.getDate()}`;

        let slipHTML = "";

        if (type === 'firing') {
            const h = document.getElementById('height').value;
            const w = document.getElementById('width').value;
            const d = document.getElementById('depth').value;
            
            if(!h || !w || !d) {
                alert("Please input the piece's Height, Width, and Depth first.");
                return;
            }

            const clay = document.getElementById('clay-select').value;
            const calculations = calculateFiringPrice();

            slipHTML = `
                <div class="slip-header-date">${formattedDateHeader}</div>
                <div style="text-align: center; font-weight: bold; margin-bottom: 10px; font-size: 14px;">*** FIRING SLIP ***</div>
                <p><strong>NAME:</strong> ${studentName}</p>
                <p><strong>CLAY BODY:</strong> ${clay}</p>
                <p><strong>DIMENSIONS:</strong> ${h}" x ${w}" x ${d}"</p>
                <p><strong>VOLUME:</strong> ${calculations.volume.toFixed(2)} Cu. In.</p>
                <p><strong>EST. CHARGE:</strong> $${calculations.cost.toFixed(2)}</p>
                <div class="barcode-mock">||||| | ||||| | ||</div>
                <p style="font-size:11px; text-align: center; margin-top: 15px; font-weight: bold;">PLACE SLIP WITH YOUR PIECE ON THE BISQUE SHELF</p>
            `;
            document.getElementById('btn-back-from-print').setAttribute('onclick', "prevStep('3-firing')");
        } else {
            const select = document.getElementById('clay-bag-select');
            const clayBagName = select.value;
            const calculations = calculateClayPrice();

            slipHTML = `
                <div class="slip-header-date" style="font-size: 22px; color: #16a085;">CLAY CLAIM VOUCHER</div>
                <div style="text-align: center; font-weight: bold; margin-bottom: 10px; font-size: 14px;">*** CLAY VOUCHER ***</div>
                <p><strong>NAME:</strong> ${studentName}</p>
                <p><strong>PRODUCT:</strong> ${clayBagName}</p>
                <p><strong>CHARGE ADDED:</strong> $${calculations.cost.toFixed(2)}</p>
                <p><strong>DATE:</strong> ${now.toLocaleDateString()}</p>
                <div class="barcode-mock">||| || | ||| || |</div>
                <p style="font-size:11px; text-align: center; margin-top: 15px; font-weight: bold; color: #16a085;">HAND TICKET TO ASSISTANT TO RETRIEVE BAG</p>
            `;
            document.getElementById('btn-back-from-print').setAttribute('onclick', "prevStep('3-clay')");
        }

        document.getElementById('slip-preview').innerHTML = slipHTML;
        nextStep(4);
    }

    async function confirmPrint() {
        const studentName = document.getElementById('student-select').value;
        let amount = 0;
        let volume = 0;
        let detailName = "";

        if (kioskMode === 'firing') {
            const calculations = calculateFiringPrice();
            amount = calculations.cost;
            volume = calculations.volume;
            detailName = document.getElementById('clay-select').value;
        } else {
            const calculations = calculateClayPrice();
            amount = calculations.cost;
            volume = 0; 
            detailName = "Clay Bag: " + document.getElementById('clay-bag-select').value;
        }

        // 1. Trigger printer dialog
        window.print();

        // 2. Log wirelessly to Make.com Webhook
        await sendToDatabaseBackend(studentName, amount, volume, detailName);

        alert("Transaction successfully recorded on your monthly statement! Slip printed.");
        resetForm();
    }

    async function sendToDatabaseBackend(student, amount, volume, detailName) {
        const payload = {
            studentName: student,
            amountDue: amount,
            cubicInches: volume,
            clayType: detailName,
            status: "Unbilled" // Default status to process at end of month
        };

        try {
            await fetch(makeWebhookUrl, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });
            console.log("Successfully logged transaction to Make.com.");
        } catch (error) {
            console.error("Error communicating with Make.com:", error);
        }
    }

    function nextStep(stepNum) {
        document.querySelectorAll('.step').forEach(step => step.classList.remove('active'));
        document.getElementById(`step-${stepNum}`).classList.add('active');
    }

    function prevStep(stepNum) {
        if (stepNum === 1) {
            nextStep(0);
        } else {
            nextStep(stepNum);
        }
    }

    function resetForm() {
        document.getElementById('height').value = '';
        document.getElementById('width').value = '';
        document.getElementById('depth').value = '';
        document.getElementById('vol-display').innerText = '0.00';
        document.getElementById('cost-display').innerText = '0.00';
        document.getElementById('logic-note-firing').innerText = '';
        nextStep(0); 
    }
</script>
